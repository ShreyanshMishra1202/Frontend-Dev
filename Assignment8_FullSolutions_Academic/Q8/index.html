<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q8 - Box Sizing</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="center">
    <h1>Box-Sizing Comparison</h1>
    <div class="compare">
      <div class="box default"><p>default box-sizing<br>width:200px;padding:20px;border:5px solid #999;</p></div>
      <div class="box border-box"><p>box-sizing:border-box<br>width:200px;padding:20px;border:5px solid #999;</p></div>
    </div>
    <p class="note">Observe how border and padding affect total width differently.</p>
  </main>
</body>
</html>
