<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q2 - Tooltip Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="center">
    <h1>CSS Tooltips</h1>
    <div class="icons">
      <div class="tooltip-wrap">
        <span class="icon" tabindex="0">📁</span>
        <span class="tooltip">Open folder</span>
      </div>
      <div class="tooltip-wrap">
        <span class="icon" tabindex="0">🔍</span>
        <span class="tooltip">Search</span>
      </div>
      <div class="tooltip-wrap">
        <span class="icon" tabindex="0">⚙️</span>
        <span class="tooltip">Settings</span>
      </div>
    </div>
  </main>
</body>
</html>
