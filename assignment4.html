<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        div{
            background-color: black;
            height: 30px;
            width: 400px;
        }
        #calc{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: end;
            border: 2px solid white;
            color: white;
            
        }
        #calc>div{
            width: 100px;
            height: 40px;
            /* border: 1px solid white; */
            text-align: center;
            line-height: 40px;
            border-radius: 50%;
            
        }
        /* #uu{
            height: 50px;
            width: 400px;
        } */
    </style>
</head>
<body>
    <!-- <div id="uu"> -->
        <div style="margin-bottom: 0px;"></div>
        <div style="margin-top: 0px;">
            <div id="calc">
                <div>&#9003;</div>
                <div>AC</div>
                <div>&#37;</div>
                <div>&divide;</div>
                <div>7</div>
                <div>8</div>
                <div>9</div>
                <div>&times;</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>&#8722;</div>
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>&plus;</div>
            </div>
        </div>
    <!-- </div> -->
</body>
</html>
