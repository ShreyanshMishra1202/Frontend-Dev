<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q1 - Borders & Padding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Borders & Padding</h1></header>
  <main>
    <section class="box-row" aria-label="Borders demonstration">
      <div class="box solid">Solid border<br><span class="meta">padding:16px; border-radius:6px;</span></div>
      <div class="box dashed">Dashed border<br><span class="meta">padding:12px; border-radius:12px;</span></div>
      <div class="box double">Double border<br><span class="meta">padding:8px; border-radius:4px;</span></div>
      <div class="box groove">Groove border<br><span class="meta">padding:20px; border-radius:10px;</span></div>
    </section>
  </main>
  <footer><p>Q1 — Borders & Padding Demo</p></footer>
</body>
</html>
