<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q7 - Typography</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="text">
    <h1>Typography Example</h1>
    <article>
