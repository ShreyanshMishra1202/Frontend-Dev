<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smilie</title>
    <style>
        div{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .circle{
            height: 200px;
            width: 200px;
            border-radius: 50%;
            background: yellow;

        }
        #eyes>#eye1, #eyes>#eye2{
            padding-top: 10px;
            height: 20px;
            width: 20px;
            align-items: center;
            border-radius: 50%;
            border: 1px solid black;
            background: black;
            color: white;
            margin: 10px;
        }
        .class>#eyes{
            padding-top: 10px;
            align-items: center;
            justify-content: space-around;
            margin: 10px;

        }
        #mouth3{
            height: 10px;
            width: 10px;
            align-items: center;
            justify-content: center;
            color: brown;
            border-color: black;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="circle">
        <div id="eyes">
            <div id="eye1"></div>
            <div id="eye2"></div>
        </div>
        <div id="mouth3"></div>
    </div>
</body>
</html>
