<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    <ul type="circle">
        <li>Aditya</li>
        <li>Brijesh</li>
        <li>Chatur</li>
        <li>Dhruv</li>
        <li>Elia</li>
    </ul>
    <ol type="I" start="5" reversed>
        <li>Shreyansh</li>
        <li>Aakarsh</li>
        <li>Virat</li>
    </ol>
</body>
</html>
